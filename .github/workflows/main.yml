name: Test

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Run unit tests
              run: npm run test

            # Гейт подачи в реестр российского ПО: перечень заимствованных компонентов
            # обязан совпадать с фактическим составом (подпункт «б» пункта 5 Правил,
            # ПП 1236). Новая зависимость без записи в THIRD-PARTY.md — красная сборка.
            - name: Перечень заимствованных компонентов совпадает с составом
              run: npm run check:third-party
