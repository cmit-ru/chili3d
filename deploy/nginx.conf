# Фронт домена cad.cmit.ru (ТЗ §9): NPM знает один upstream — этот nginx.
#   /      → оболочка (стек cad-app, Node)
#   /3d/   → статика редактора (форк Chili3D) из этого образа
# Конфиг живёт в публичном репозитории — он часть AGPL-сборки редактора.

# Docker DNS: без него nginx резолвит имя апстрима один раз при старте
# и держит мёртвый IP после редеплоя оболочки (вечный 502).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    absolute_redirect off;
    listen [::]:80;
    server_name _;

    client_max_body_size 24m;
    gzip_static on;

    # AGPL §13: пользователь редактора должен получить исходники ИМЕННО той
    # версии, с которой работает. Ведём в российское хранилище — оно первично;
    # зеркало на github.com/cmit-ru/chili3d остаётся для тех, кому туда удобнее.
    location = /3d/source {
        return 302 https://gitverse.ru/cmit/chili3d;
    }

    # Строгая политика безопасности содержимого мастерской (ТЗ §9, фаза 1.1r).
    #
    # unsafe-eval НЕ разрешён: ядро пересобрано с `-sDYNAMIC_EXECUTION=0`,
    # склейка emscripten больше не создаёт функции из строк. Порядок включения
    # выстрадан 30.08.2026: первая попытка уронила мастерскую на бою, потому
    # что проверка была только поиском по бандлу. Теперь строгий заголовок
    # сперва репетируется в браузере подменой ответа
    # (тест maketka-csp-dryrun.spec.ts) и лишь потом попадает сюда.
    #
    # wasm-unsafe-eval нужен всегда: он разрешает инстанцировать WebAssembly,
    # но не исполнять код из строки. Инлайновые стили — оформление элементов
    # редактора через cssText.
    set $editor_csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'";

    # Редактор: файлы лежат в /usr/share/nginx/html/3d, поэтому обычный root.
    # (alias в regex-локации склеивал путь неверно и отдавал 404.)
    root /usr/share/nginx/html;

    location = /3d {
        return 301 /3d/;
    }

    # Страница работы (/3d/6) — это оболочка: она проверяет доступ и рисует
    # шапку с именем ученика. Без этого правила nginx отдавал бы здесь статику
    # редактора, и ребёнок попадал на домашний экран Chili3D вместо своей работы.
    location ~ ^/3d/([0-9]+)$ {
        # Номер работы кладём в переменную: в подзапрос захваты regex-локации
        # не передаются, а переменные — да.
        set $work_id $1;

        # Оболочка решает, можно ли ребёнку открыть эту работу: перебор чужих
        # адресов не должен показывать даже загрузку редактора.
        auth_request /_access_check;
        error_page 401 = @join;
        # Оболочка отвечает 403 на чужую работу: auth_request знает только 401 и
        # 403, на 404 nginx отдавал 500 («auth request unexpected status»).
        error_page 403 = @work_not_found;

        # Доступ есть — отдаём саму мастерскую (без промежуточного экрана).
        # always: заголовок нужен и на ответах, отданных через try_files,
        # иначе браузер держит устаревшую страницу после обновления редактора.
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Content-Security-Policy $editor_csp always;
        try_files /3d/index.html =404;
    }

    location = /_access_check {
        internal;
        set $shell_auth "http://cad-app:3000/_access?id=$work_id";
        proxy_pass $shell_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @join {
        return 302 /join;
    }

    location @work_not_found {
        # Чужая работа — «не найдено», а не «нет доступа»: не подтверждаем,
        # что такая работа существует.
        set $shell_404 "http://cad-app:3000/no-such-work";
        proxy_pass $shell_404;
        proxy_set_header Host $host;
    }

    # Иконка мастерской — общая иконка проекта, а не перец из исходного Chili3D.
    # Подменяем СНАРУЖИ форка: правка в самом форке тащилась бы через каждое
    # обновление ядра (tz-workspace.md §7.4, И-6). Отдаёт оболочка — так иконка
    # у проекта одна и лежит в одном месте.
    location = /3d/favicon.svg {
        set $shell_icon "http://cad-app:3000";
        proxy_pass $shell_icon/favicon.svg;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /3d/favicon.ico {
        set $shell_icon2 "http://cad-app:3000";
        proxy_pass $shell_icon2/favicon.ico;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Хэшированные ассеты можно кэшировать навсегда: имя меняется вместе с
    # содержимым, устаревший редактор ребёнку не достанется.
    location ~* ^/3d/.+\.(js|css|wasm|woff2|svg|png|jpg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $editor_csp always;
    }

    location /3d/ {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Content-Security-Policy $editor_csp always;
        try_files $uri $uri/ /3d/index.html;
    }

    # Оболочка: адрес апстрима — через переменную, иначе кэш DNS (см. resolver выше)
    location / {
        set $shell "http://cad-app:3000";
        proxy_pass $shell;
        proxy_http_version 1.1;
        # $http_host, а не $host: $host отбрасывает порт, и на стенде экспертизы
        # (http://localhost:8080) оболочка сравнивала Origin «localhost:8080» с
        # Host «localhost» и отказывала в запуске сборки скетча. На бою порт
        # стандартный, разницы нет. Найдено прогоном стенда 01.09.2026.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # Пока оболочка недоступна — честная страница вместо 502 без объяснений
        proxy_intercept_errors on;
        error_page 502 503 504 = @down;
    }

    location @down {
        default_type text/html;
        return 503 '<!doctype html><html lang="ru"><meta charset="utf-8"><title>Сервис недоступен</title><body style="font-family:system-ui;max-width:40em;margin:15vh auto;padding:0 1.5em;color:#0B1F1A"><h1>Сервис ненадолго недоступен</h1><p>Твои работы целы. Попробуй обновить страницу через минуту.</p></body></html>';
    }
}
